server:
  port: 8080

spring:
  application:
    name: linlan-emis
  # 默认使用 H2 内存库，零依赖即可启动；生产切换到 MySQL（见下方注释）
  datasource:
    url: jdbc:h2:mem:emis;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
  # OAuth2 授权服务器颁发者（OIDC Discovery 使用，须与浏览器访问地址一致）
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080

mybatis:
  type-aliases-package: net.linlan.emis.*.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置（前缀由 dsh.ontology.* 统一改为 emis.* ）
emis:
  jwt:
    secret: "linlan-emis-change-me-in-production-0123456789abcdef"
    expiration-ms: 86400000
    header: Authorization
    prefix: "Bearer "
    # 桌面端无登录界面时默认以主任放行：仅本地/内网演示用，生产务必 false
    default-director-enabled: false
